<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestro Álbum de Recuerdos Mágicos</title>
    <!-- Iconos de FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts para una tipografía hermosa -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --rosa-pastel: #ffe5ec;
            --rosa-medio: #ffb3c6;
            --rosa-brillante: #ff85a1;
            --rosa-oscuro: #f72585;
            --blanco-transparente: rgba(255, 255, 255, 0.9);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, var(--rosa-pastel), #fff0f5);
            min-height: 100vh;
            color: #4a4a4a;
            overflow-x: hidden;
            position: relative;
            padding-bottom: 50px;
        }

        /* --- EFECTO DE ICONOS CAYENDO --- */
        .lluvia-iconos {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        .corazon-cayendo {
            position: absolute;
            top: -20px;
            color: var(--rosa-brillante);
            animation: caida linear infinite;
            opacity: 0.7;
        }

        @keyframes caida {
            0% {
                transform: translateY(-20px) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 0.7; }
            90% { opacity: 0.7; }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* --- CONTENEDOR PRINCIPAL --- */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 10;
        }

        header {
            text-align: center;
            margin-top: 30px;
            margin-bottom: 40px;
        }

        header h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            color: var(--rosa-oscuro);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1rem;
            color: #7a7a7a;
            font-style: italic;
        }

        /* --- SECCIÓN SUBIR RECUERDO --- */
        .seccion-subir {
            background: var(--blanco-transparente);
            border: 2px dashed var(--rosa-medio);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 24px rgba(255, 133, 161, 0.15);
            backdrop-filter: blur(5px);
            margin-bottom: 40px;
            transition: transform 0.3s ease;
        }

        .seccion-subir:hover {
            transform: translateY(-2px);
        }

        .seccion-subir h2 {
            color: var(--rosa-oscuro);
            margin-bottom: 20px;
            font-size: 1.6rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-grupo {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: 600;
            color: #555;
        }

        input[type="text"], input[type="date"], textarea {
            padding: 12px;
            border: 2px solid var(--rosa-pastel);
            border-radius: 12px;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus, input[type="date"]:focus, textarea:focus {
            border-color: var(--rosa-brillante);
        }

        .input-carpeta-contenedor {
            position: relative;
            display: flex;
            align-items: center;
        }

        .prefijo-carpeta {
            background: #f0f0f0;
            padding: 12px 15px;
            border: 2px solid var(--rosa-pastel);
            border-right: none;
            border-radius: 12px 0 0 12px;
            font-weight: 600;
            color: #777;
        }

        #nombre-foto {
            flex: 1;
            border-radius: 0 12px 12px 0;
        }

        .btn-guardar {
            background: linear-gradient(45deg, var(--rosa-brillante), var(--rosa-oscuro));
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(247, 37, 133, 0.3);
            transition: all 0.3s;
        }

        .btn-guardar:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(247, 37, 133, 0.4);
        }

        /* --- SECCIÓN ÁLBUM --- */
        .album-titulo {
            text-align: center;
            font-family: 'Dancing Script', cursive;
            font-size: 2.8rem;
            color: var(--rosa-oscuro);
            margin-bottom: 30px;
        }

        .grid-album {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        /* Tarjeta de Recuerdo (Efecto Polaroid Hermoso) */
        .tarjeta-recuerdo {
            background: white;
            padding: 15px 15px 25px 15px;
            border-radius: 4px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            transform: rotate(var(--rotacion));
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .tarjeta-recuerdo:hover {
            transform: scale(1.05) rotate(0deg) !important;
            z-index: 20;
            box-shadow: 0 15px 35px rgba(247, 37, 133, 0.2);
        }

        .tarjeta-recuerdo::before {
            content: '📌';
            position: absolute;
            top: -12px;
            left: 46%;
            font-size: 1.2rem;
            z-index: 5;
        }

        .contenedor-foto-tarjeta {
            width: 100%;
            height: 230px;
            overflow: hidden;
            border: 1px solid #eee;
            margin-bottom: 15px;
            position: relative;
            background: #fafafa;
        }

        .contenedor-foto-tarjeta img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .fecha-tarjeta {
            display: inline-block;
            background: var(--rosa-pastel);
            color: var(--rosa-oscuro);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .titulo-tarjeta {
            font-size: 1.2rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .descripcion-tarjeta {
            font-size: 0.95rem;
            color: #666;
            line-height: 1.4;
        }

        .btn-eliminar {
            position: absolute;
            bottom: 10px;
            right: 15px;
            background: none;
            border: none;
            color: #ccc;
            cursor: pointer;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .btn-eliminar:hover {
            color: var(--rosa-oscuro);
        }

        .sin-recuerdos {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: #aaa;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="lluvia-iconos" id="lluvia"></div>

    <div class="container">
        <header>
            <h1>Mis Regalitos y Recuerdos</h1>
            <p>Un espacio mágico para revivir cada detalle inolvidable ✨</p>
        </header>

        <!-- Formulario para agregar recuerdos -->
        <section class="seccion-subir">
            <h2><i class="fa-solid fa-heart-circle-plus"></i> Añadir un nuevo momento</h2>
            <form id="form-recuerdo">
                <div class="form-grupo">
                    <label for="titulo">¿Qué regalito o momento es?</label>
                    <input type="text" id="titulo" placeholder="Ej. El oso gigante que me diste" required>
                </div>

                <div class="form-grupo">
                    <label for="fecha">Fecha especial:</label>
                    <input type="date" id="fecha" required>
                </div>

                <div class="form-grupo">
                    <label for="descripcion">Cuéntame la historia de este día:</label>
                    <textarea id="descripcion" rows="3" placeholder="Detalles hermosos que no quieres olvidar..." required></textarea>
                </div>

                <div class="form-grupo">
                    <label for="nombre-foto">Nombre de la foto guardada en tu carpeta:</label>
                    <div class="input-carpeta-contenedor">
                        <span class="prefijo-carpeta">fotos/</span>
                        <input type="text" id="nombre-foto" placeholder="ejemplo.jpg" required>
                    </div>
                </div>

                <button type="submit" class="btn-guardar">Guardar en el álbum 💞</button>
            </form>
        </section>

        <hr style="border: 0; height: 1px; background: linear-gradient(to right, transparent, var(--rosa-medio), transparent); margin-bottom: 40px;">

        <!-- El álbum de fotos -->
        <section>
            <h2 class="album-titulo">Nuestro Álbum de Recuerdos</h2>
            <div class="grid-album" id="contenedor-album">
                <!-- Los recuerdos se cargarán aquí -->
            </div>
        </section>
    </div>

    <script>
        // --- 1. CONFIGURACIÓN DE LA LLUVIA DE ICONOS ---
        const iconos = ['❤️', '💖', '✨', '🌸', '🎁', '🧸', '💝'];
        const contenedorLluvia = document.getElementById('lluvia');

        function crearIcono() {
            const icono = document.createElement('div');
            icono.classList.add('corazon-cayendo');
            icono.innerText = iconos[Math.floor(Math.random() * iconos.length)];
            icono.style.left = Math.random() * 100 + 'vw';
            icono.style.animationDuration = Math.random() * 3 + 3 + 's';
            icono.style.fontSize = Math.random() * 15 + 12 + 'px';
            
            contenedorLluvia.appendChild(icono);
            setTimeout(() => { icono.remove(); }, 6000);
        }
        setInterval(crearIcono, 400);

        // --- 2. SISTEMA DEL ÁLBUM CON RUTAS LOCALES ---
        const form = document.getElementById('form-recuerdo');
        const contenedorAlbum = document.getElementById('contenedor-album');

        document.addEventListener('DOMContentLoaded', mostrarRecuerdos);

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const titulo = document.getElementById('titulo').value;
            const fecha = document.getElementById('fecha').value;
            const descripcion = document.getElementById('descripcion').value;
            const nombreFoto = document.getElementById('nombre-foto').value;

            // Construimos la ruta relativa apuntando a tu carpeta física
            const rutaCompletaFoto = 'fotos/' + nombreFoto;

            const nuevoRecuerdo = {
                id: Date.now(),
                titulo: titulo,
                fecha: formatearFecha(fecha),
                fechaRaw: fecha,
                descripcion: descripcion,
                foto: rutaCompletaFoto // Guardamos la ruta del archivo
            };

            let recuerdos = JSON.parse(localStorage.getItem('misRecuerdosRutas')) || [];
            recuerdos.push(nuevoRecuerdo);
            
            // Ordenar: Los más recientes primero
            recuerdos.sort((a, b) => new Date(b.fechaRaw) - new Date(a.fechaRaw));

            localStorage.setItem('misRecuerdosRutas', JSON.stringify(recuerdos));

            form.reset();
            mostrarRecuerdos();
        });

        function formatearFecha(fechaStr) {
            const partes = fechaStr.split('-');
            if(partes.length === 3) {
                return `${partes[2]}/${partes[1]}/${partes[0]}`;
            }
            return fechaStr;
        }

        function mostrarRecuerdos() {
            contenedorAlbum.innerHTML = '';
            const recuerdos = JSON.parse(localStorage.getItem('misRecuerdosRutas')) || [];

            if (recuerdos.length === 0) {
                contenedorAlbum.innerHTML = `<div class="sin-recuerdos">💖 Aún no hay recuerdos en el álbum. ¡Añade el primero arriba! 💖</div>`;
                return;
            }

            recuerdos.forEach(recuerdo => {
                const rotacionAleatoria = (Math.random() * 6 - 3).toFixed(2) + 'deg';

                const tarjeta = document.createElement('div');
                tarjeta.classList.add('tarjeta-recuerdo');
                tarjeta.style.setProperty('--rotacion', rotacionAleatoria);

                tarjeta.innerHTML = `
                    <div class="contenedor-foto-tarjeta">
                        <img src="${recuerdo.foto}" alt="Momento hermoso" onerror="this.src='https://images.unsplash.com/photo-1518199266791-5375a83190b7?q=80&w=500&auto=format&fit=crop'; console.log('No se encontró la foto en la carpeta local');">
                    </div>
                    <span class="fecha-tarjeta"><i class="fa-regular fa-calendar-days"></i> ${recuerdo.fecha}</span>
                    <h3 class="titulo-tarjeta">${recuerdo.titulo}</h3>
                    <p class="descripcion-tarjeta">${recuerdo.descripcion}</p>
                    <button class="btn-eliminar" onclick="eliminarRecuerdo(${recuerdo.id})">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                `;

                contenedorAlbum.appendChild(tarjeta);
            });
        }

        window.eliminarRecuerdo = function(id) {
            if(confirm("¿Seguro que quieres quitar este recuerdo de tu álbum? 🥺")) {
                let recuerdos = JSON.parse(localStorage.getItem('misRecuerdosRutas')) || [];
                recuerdos = recuerdos.filter(r => r.id !== id);
                localStorage.setItem('misRecuerdosRutas', JSON.stringify(recuerdos));
                mostrarRecuerdos();
            }
        }
    </script>
</body>
</html>
