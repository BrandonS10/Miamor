<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestro Álbum de Recuerdos Mágicos</title>
    <!-- Iconos de FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght=700&family=Quicksand:wght=400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --rosa-pastel: #ffe5ec;
            --rosa-medio: #ffb3c6;
            --rosa-brillante: #ff85a1;
            --rosa-oscuro: #f72585;
            --blanco-transparente: rgba(255, 255, 255, 0.9);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, var(--rosa-pastel), #fff0f5);
            min-height: 100vh;
            color: #4a4a4a;
            overflow-x: hidden;
            position: relative;
            padding-bottom: 50px;
        }

        /* --- EFECTO DE ICONOS CAYENDO --- */
        .lluvia-iconos {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        .corazon-cayendo {
            position: absolute;
            top: -20px;
            color: var(--rosa-brillante);
            animation: caida linear infinite;
            opacity: 0.7;
        }

        @keyframes caida {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 0; }
            10% { opacity: 0.7; }
            90% { opacity: 0.7; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 10;
        }

        header {
            text-align: center;
            margin-top: 30px;
            margin-bottom: 40px;
        }

        header h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            color: var(--rosa-oscuro);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        header p {
            font-size: 1.1rem;
            color: #7a7a7a;
            font-style: italic;
        }

        /* --- ESTILO CALENDARIO (POR MESES) --- */
        .bloque-mes {
            margin-bottom: 40px;
            position: relative;
        }

        .titulo-mes {
            font-family: 'Dancing Script', cursive;
            font-size: 2.5rem;
            color: var(--rosa-oscuro);
            background: rgba(255, 255, 255, 0.8);
            display: inline-block;
            padding: 5px 20px;
            border-radius: 30px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border-left: 5px solid var(--rosa-brillante);
        }

        .grid-album {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        /* Tarjeta Polaroid */
        .tarjeta-recuerdo {
            background: white;
            padding: 15px 15px 25px 15px;
            border-radius: 4px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.06);
            position: relative;
            transform: rotate(var(--rotacion));
            transition: all 0.3s;
        }

        .tarjeta-recuerdo:hover {
            transform: scale(1.04) rotate(0deg) !important;
            z-index: 5;
            box-shadow: 0 15px 30px rgba(247, 37, 133, 0.15);
        }

        .tarjeta-recuerdo::before {
            content: '📌';
            position: absolute;
            top: -12px;
            left: 46%;
            font-size: 1.2rem;
        }

        .contenedor-foto-tarjeta {
            width: 100%;
            height: 230px;
            overflow: hidden;
            border: 1px solid #f5f5f5;
            margin-bottom: 15px;
        }

        .contenedor-foto-tarjeta img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .dia-etiqueta {
            display: inline-block;
            background: var(--rosa-pastel);
            color: var(--rosa-oscuro);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .titulo-tarjeta {
            font-size: 1.2rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
        }

        .descripcion-tarjeta {
            font-size: 0.95rem;
            color: #666;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="lluvia-iconos" id="lluvia"></div>

    <div class="container">
        <header>
            <h1>Nuestro Álbum de Recuerdos</h1>
            <p>Momentos preciosos organizados en el tiempo ✨</p>
        </header>

        <!-- Aquí se dibuja el calendario automáticamente -->
        <section id="calendario-recuerdos"></section>
    </div>

    <script>
        // ==========================================
        // TU ARRAY DE FOTOS (Aquí agregas tus recuerdos)
        // ==========================================
        // La fecha debe ir siempre en formato "AAAA-MM-DD"
        // La foto debe ser el nombre exacto que tiene en tu carpeta fotosalbum/
        
        const misRecuerdos = [
            {
                titulo: "Nuestro primer picnic",
                fecha: "2026-05-14",
                descripcion: "Comimos fresas con chocolate y pasamos una tarde increíble juntos bajo el sol.",
                foto: "picnic.jpg"
            },
            {
                titulo: "El oso gigante de regalo",
                fecha: "2026-05-20",
                descripcion: "Llegaste de sorpresa con este peluche hermoso que apenas cabía por la puerta.",
                foto: "oso.png"
            },
            {
                titulo: "Cena de aniversario",
                fecha: "2026-06-02",
                descripcion: "Fuimos a cenar delicioso para celebrar nuestro tiempo juntos. Todo estuvo precioso.",
                foto: "cena.jpg"
            }
            // Cuando quieras agregar uno nuevo, pones una coma aquí abajo y copias el bloque:
            // ,{
            //    titulo: "Nuevo recuerdo",
            //    fecha: "2026-07-07",
            //    descripcion: "Descripción del momento...",
            //    foto: "nombre_de_la_foto.jpg"
            // }
        ];

        // ==========================================
        // LÓGICA AUTOMÁTICA DEL CALENDARIO
        // ==========================================
        const calendarioRecuerdos = document.getElementById('calendario-recuerdos');

        // Ordenar los recuerdos por fecha (más recientes primero)
        misRecuerdos.sort((a, b) => new Date(b.fecha) - new Date(a.fecha));

        const mesesNombre = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
        let datosAgrupados = {};

        // Agruparlos por Año y Mes
        misRecuerdos.forEach((recuerdo) => {
            const partes = recuerdo.fecha.split('-');
            if(partes.length === 3) {
                const anio = partes[0];
                const mesIndex = parseInt(partes[1], 10) - 1;
                const dia = partes[2];
                const nombreMesAnio = `${mesesNombre[mesIndex]} ${anio}`;

                if(!datosAgrupados[nombreMesAnio]) {
                    datosAgrupados[nombreMesAnio] = [];
                }
                
                datosAgrupados[nombreMesAnio].push({
                    dia: dia,
                    ...recuerdo
                });
            }
        });

        // Pintar los bloques de meses y sus fotos en la página
        for (const [mesAnio, recuerdos] of Object.entries(datosAgrupados)) {
            const bloque = document.createElement('div');
            bloque.classList.add('bloque-mes');
            
            bloque.innerHTML = `<h3 class="titulo-mes"><i class="fa-regular fa-calendar"></i> ${mesAnio}</h3>`;
            
            const grid = document.createElement('div');
            grid.classList.add('grid-album');

            recuerdos.forEach(recuerdo => {
                const rotacion = (Math.random() * 6 - 3).toFixed(2) + 'deg';
                const tarjeta = document.createElement('div');
                tarjeta.classList.add('tarjeta-recuerdo');
                tarjeta.style.setProperty('--rotacion', rotacion);

                tarjeta.innerHTML = `
                    <div class="contenedor-foto-tarjeta">
                        <!-- Busca la foto directamente dentro de tu carpeta fotosalbum/ -->
                        <img src="fotosalbum/${recuerdo.foto}" alt="Recuerdo">
                    </div>
                    <span class="dia-etiqueta">Día ${recuerdo.dia}</span>
                    <h4 class="titulo-tarjeta">${recuerdo.titulo}</h4>
                    <p class="descripcion-tarjeta">${recuerdo.descripcion}</p>
                `;
                grid.appendChild(tarjeta);
            });

            bloque.appendChild(grid);
            calendarioRecuerdos.appendChild(bloque);
        }

        // --- ANIMACIÓN DE ICONOS CAYENDO ---
        const iconos = ['❤️', '💖', '✨', '🌸', '🎁', '💝'];
        const contenedorLluvia = document.getElementById('lluvia');

        function crearIcono() {
            const icono = document.createElement('div');
            icono.classList.add('corazon-cayendo');
            icono.innerText = iconos[Math.floor(Math.random() * iconos.length)];
            icono.style.left = Math.random() * 100 + 'vw';
            icono.style.animationDuration = Math.random() * 3 + 3 + 's';
            icono.style.fontSize = Math.random() * 15 + 12 + 'px';
            
            contenedorLluvia.appendChild(icono);
            setTimeout(() => { icono.remove(); }, 6000);
        }
        setInterval(crearIcono, 400);
    </script>
</body>
</html>
